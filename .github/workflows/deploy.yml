name: Build & Deploy to Hostinger

# כל push לענף main -> בנייה אוטומטית של Astro -> העלאה להוסטינגר ב-FTP
on:
  push:
    branches: [main]
    paths-ignore:        # שינויי תיעוד/כלים לא מפעילים deploy (חוסך FTP)
      - 'CLAUDE.md'
      - 'CONTENT-GUIDE.md'
      - 'README.md'
      - '_migration/**'
      - '.gitignore'
      - '.gitattributes'
  workflow_dispatch: # אפשרות להפעלה ידנית מ-GitHub

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Deploy to Hostinger via SSH (rsync)
        # FTP-Deploy-Action הוחלף ב-2026-08-29: ה-FTP נכשל שוב ושוב, ובנוסף גילינו
        # שאינטגרציית ה-Git הנייטיבית של הוסטינגר (hPanel) עשתה checkout גולמי של
        # הריפו (ללא build!) לאותה תיקייה - התנגשות שהפילה את האתר. תיקון: כיבינו
        # את פריסת ה-Git של הוסטינגר, ועברנו ל-SSH+rsync שבודק כאן ב-build אמיתי.
        uses: easingthemes/ssh-deploy@v5
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.SSH_HOST }}      # 82.29.187.1
          REMOTE_PORT: ${{ secrets.SSH_PORT }}      # 65002
          REMOTE_USER: ${{ secrets.SSH_USERNAME }}  # u260375810
          SOURCE: "dist/"
          TARGET: ${{ secrets.SSH_REMOTE_DIR }}     # domains/plumbernow.co.il/public_html/
          ARGS: "-avzr --delete"
          EXCLUDE: ".git*"
